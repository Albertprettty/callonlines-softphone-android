name: SIP server test

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Number to call'
        required: true
        default: '18777272932'
      duration:
        description: 'Call hold duration (seconds)'
        required: true
        default: '30'

jobs:
  sip-test:
    name: REGISTER + INVITE to ${{ github.event.inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show SIP env (no secrets printed)
        run: |
          echo "Host secret defined: ${{ secrets.SIP_HOST != '' }}"
          echo "User secret defined: ${{ secrets.SIP_USER != '' }}"
          echo "Pass secret defined: ${{ secrets.SIP_PASS != '' }}"
      - name: Run SIP test
        env:
          SIP_HOST: ${{ secrets.SIP_HOST }}
          SIP_USER: ${{ secrets.SIP_USER }}
          SIP_PASS: ${{ secrets.SIP_PASS }}
          TARGET:   ${{ github.event.inputs.target }}
          DURATION: ${{ github.event.inputs.duration }}
        run: python3 scripts/sip_test.py 2>&1 | tee sip_test.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sip-test-log
          path: sip_test.log
