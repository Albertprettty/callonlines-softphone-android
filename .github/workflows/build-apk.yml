name: Build CallOnLines Softphone APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew executable
        run: |
          if [ ! -x gradlew ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: List APK output
        run: ls -lh app/build/outputs/apk/debug/ || true
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/CallOnLines-Softphone-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallOnLines-Softphone-debug
          path: out/CallOnLines-Softphone-debug.apk
